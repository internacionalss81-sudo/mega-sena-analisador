name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      -- name: Dependências
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential libffi-dev libssl-dev libsqlite3-dev \
      zlib1g-dev libjpeg-dev libpng-dev ccache ffmpeg libsdl2-dev libsdl2-image-dev \
      libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
      libavcodec-dev openjdk-17-jdk zip unzip
    pip install --upgrade pip
    pip install "buildozer==1.5.0" "python-for-android==2024.1.21" Cython==0.29.33

      - name: Gerar APK
        run: |
          buildozer android release
        env:
          ACCEPT_BUILD_TOOLS_CHECKSUM: "true"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mega-analyzer-apk
          path: bin/*.apk
