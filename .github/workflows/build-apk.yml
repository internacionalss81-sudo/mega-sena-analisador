```yaml
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            patch \
            wget

      - name: Verificar Python
        run: |
          python --version
          pip --version

      - name: Limpar compilação anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython==0.29.37"

      - name: Verificar Buildozer
        run: |
          buildozer --version

      - name: Verificar configuração
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "===== requirements.txt ====="
          cat requirements.txt

      - name: Gerar APK
        run: |
          buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaAnalyzer-APK
          path: bin/*.apk
          if-no-files-found: error
```
