name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.10
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython
      - name: Gerar APK
        run: buildozer -v android debug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaAnalyzer-APK
          path: bin/*.apk
          if-no-files-found: error
